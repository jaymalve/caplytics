name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # Before typecheck, not only before test. The dashboard and the example resolve
      # @caplytics/core and caplytics through their published exports maps, which point at dist/ —
      # on a clean checkout there is nothing there to check against until the build has run.
      - run: bun run build

      - run: bun run typecheck

      - run: bun test
