name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The schema and query layers are only genuinely verified against a real TimescaleDB — SQL
      # that parses as a string still fails against a real hypertable.
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: caplytics
          POSTGRES_PASSWORD: caplytics
          POSTGRES_DB: caplytics
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U caplytics"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # Lint, build, typecheck, test. Build precedes typecheck because the dashboard and the
      # example resolve core through its exports map, and it precedes test because the packaging
      # invariants in test/ assert against real build output.
      - run: bun run verify

      - name: Integration tests
        run: bun test
        env:
          CAPLYTICS_TEST_DATABASE_URL: postgres://caplytics:caplytics@localhost:5433/caplytics

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Built on every change, because §8.7 makes the image the dashboard's only distribution and a
      # broken Dockerfile is a broken release.
      - run: docker build -t caplytics/dashboard:ci .
