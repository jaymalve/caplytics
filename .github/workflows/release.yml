name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      # Nothing is published that has not passed the same gate as every commit.
      - run: bun run verify

      # Core first: `caplytics` depends on it, and a dependency published second is a broken
      # install for anyone who catches the window between them.
      - run: npm publish --provenance --access public
        working-directory: packages/core
      - run: npm publish --provenance --access public
        working-directory: packages/caplytics
